<text x="427" y="24" fill="#6b717c" text-anchor="middle" style="font-size:12px">rewind guard</text>
<text x="22" y="65.5" xml:space="preserve"><tspan fill="#5cc5d6" font-weight="700">$</tspan><tspan fill="#d7dae0"> rewind guard check "git reset --hard"</tspan></text>
<text x="22" y="86.4" xml:space="preserve"><tspan fill="#f0646a" font-weight="700">BLOCK</tspan><tspan fill="#d7dae0">  git reset --hard</tspan></text>
<text x="22" y="107.3" xml:space="preserve"><tspan fill="#d7dae0">  </tspan><tspan fill="#e2b85c">high</tspan><tspan fill="#d7dae0">     git-reset-hard  </tspan><tspan fill="#d7dae0" opacity="0.6">git reset --hard discards uncommitted work (git reset --hard)</tspan></text>
<text x="22" y="128.3" xml:space="preserve"></text>
<text x="22" y="149.2" xml:space="preserve"><tspan fill="#5cc5d6" font-weight="700">$</tspan><tspan fill="#d7dae0"> rewind guard check "cd /tmp &amp;&amp; rm -rf ~/"</tspan></text>
<text x="22" y="170.1" xml:space="preserve"><tspan fill="#f0646a" font-weight="700">BLOCK</tspan><tspan fill="#d7dae0">  cd /tmp &amp;&amp; rm -rf ~/</tspan></text>
<text x="22" y="191.1" xml:space="preserve"><tspan fill="#d7dae0">  </tspan><tspan fill="#f0646a">critical</tspan><tspan fill="#d7dae0"> rm-home  </tspan><tspan fill="#d7dae0" opacity="0.6">rm -r on your home directory (~/)</tspan></text>
<text x="22" y="212.0" xml:space="preserve"></text>
<text x="22" y="232.9" xml:space="preserve"><tspan fill="#5cc5d6" font-weight="700">$</tspan><tspan fill="#d7dae0"> rewind guard check "rm -rf node_modules dist"</tspan></text>
<text x="22" y="253.8" xml:space="preserve"><tspan fill="#4fc88f">✓</tspan><tspan fill="#d7dae0"> looks safe</tspan></text>
