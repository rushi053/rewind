name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e . pytest
      - name: Check there are no runtime dependencies
        run: python -c "import importlib.metadata as m; r = m.requires('rewind-cli') or []; assert not [x for x in r if 'extra' not in x], r"
      - name: Test
        run: python -m pytest -o addopts="" -ra
      - name: Surface app.log if the app failed to start
        if: failure()
        run: |
          echo "The app test includes the tail of app.log in its assertion. This step also prints any copy left on disk."
          find "$HOME" /tmp "$RUNNER_TEMP" -name app.log -type f 2>/dev/null | head -20 | while read -r f; do
            echo "===== $f ====="
            tail -n 80 "$f" || true
          done
      - name: Launchers (macOS bundle is linted with plutil on macOS runners)
        run: |
          REWIND_BIN="$(command -v rewind)" sh scripts/build-macos-app.sh "$RUNNER_TEMP/app"
          if command -v plutil >/dev/null; then plutil -lint "$RUNNER_TEMP/app/Rewind.app/Contents/Info.plist"; fi
          sh -n install.sh
      - name: End-to-end disaster demo
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          REWIND_COLOR=never bash scripts/disaster-demo.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: python -m pip install build && python -m build
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/w && /tmp/w/bin/pip install dist/*.whl
          /tmp/w/bin/rewind --version
          /tmp/w/bin/python -c "import rewind_cli, pathlib; d = pathlib.Path(rewind_cli.__file__).parent / 'static'; assert all((d / f).exists() for f in ('ui.html', 'app.html', 'icon.icns', 'icon.ico', 'icon-256.png', 'icon-32.png'))"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' | /tmp/w/bin/rewind mcp | grep -q '"protocolVersion":"2025-06-18"'
